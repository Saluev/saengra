site_name: Saengra Documentation
site_url: https://saengra.readthedocs.io/
repo_name: GitHub
repo_url: https://github.com/Saluev/saengra/
site_description: Reactive pattern-matching in-memory graph database for Python
nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
      - Social Network: tutorial_social.md
  - Usage:
      - Graphs: usage_graphs.md
      - Entities: usage_entities.md
theme: readthedocs
plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            docstring_style: google
markdown_extensions:
  - admonition

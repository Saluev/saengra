name: Profiling

on:
  push:
    branches: ['profile/*']

jobs:
  profile:
    name: Profile on Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Run profiling on remote machine
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          GIT_REF: ${{ github.sha }}
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -o StrictHostKeyChecking=no ${USER}@${HOST}"
          $SSH bash -s "$GIT_REF" << 'REMOTE_SCRIPT'
            set -euo pipefail
            GIT_REF="$1"
            WORKDIR="$HOME/profile-run"
            RESULTS="$HOME/results"

            mkdir -p "$WORKDIR" "$RESULTS"

            echo "Setting up saengra"
            if [ -d "$WORKDIR/saengra" ]; then
              cd "$WORKDIR/saengra"
              git fetch origin
              git checkout "$GIT_REF"
              git submodule update --init --recursive
            else
              git clone --recursive https://github.com/Saluev/saengra.git "$WORKDIR/saengra"
              cd "$WORKDIR/saengra"
              git checkout "$GIT_REF"
            fi

            echo "Setting up venv"
            if [ ! -d "$WORKDIR/venv" ]; then
              python3 -m venv "$WORKDIR/venv"
            fi
            source "$WORKDIR/venv/bin/activate"

            echo "Building saengra"
            pip install setuptools wheel "cmake>=3.15"
            AVOID_HOMEBREW=1 SAENGRA_DEBUG=1 pip install --no-cache-dir --force-reinstall --no-build-isolation -e ".[dev]"
            python -c "from saengra.c_extension import DirectAdapter; print('c_extension OK')"

            echo "Setting up vic"
            if [ -d "$WORKDIR/vic" ]; then
              cd "$WORKDIR/vic"
              git pull || true
              cd "$WORKDIR/saengra"
            else
              git clone git@github.com:Saluev/vic.git "$WORKDIR/vic"
            fi
            pip install -r "$WORKDIR/vic/requirements.txt"
          REMOTE_SCRIPT

      - name: "Profile actions"
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          GIT_REF: ${{ github.sha }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no ${USER}@${HOST}"
          $SSH bash -s "$GIT_REF" << 'REMOTE_SCRIPT'
            set -euo pipefail
            GIT_REF="$1"
            WORKDIR="$HOME/profile-run"
            RESULTS="$HOME/results"
            source "$WORKDIR/venv/bin/activate"
  
            set +e
            perf record -g --call-graph dwarf -o "$RESULTS/perf.data" -- \
              python -m pytest "$WORKDIR/vic/tests/vic/actions" -v -s 2>&1 | tail -20
            set -e
            
            perf report -n --show-total-period --stdio --sort=sym -g none -i "$RESULTS/perf.data" > "$RESULTS/actions-report.txt" 2>/dev/null
    
            rm "$RESULTS/perf.data"
          REMOTE_SCRIPT

      - name: "Profile benchmarks"
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          GIT_REF: ${{ github.sha }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no ${USER}@${HOST}"
          $SSH bash -s "$GIT_REF" << 'REMOTE_SCRIPT'
            set -euo pipefail
            GIT_REF="$1"
            WORKDIR="$HOME/profile-run"
            RESULTS="$HOME/results"
            source "$WORKDIR/venv/bin/activate"

            set +e
            SAENGRA_INCREMENTAL_MATCHER_TIMING="$RESULTS/incremental-matcher-timing.txt" \
              perf record -g --call-graph dwarf -o "$RESULTS/perf.data" -- \
              python -m pytest "$WORKDIR/vic/tests/vic/profiling" -v -s
            set -e
            
            perf report -n --show-total-period --stdio --sort=sym -g none -i "$RESULTS/perf.data" > "$RESULTS/benchmarks-report.txt" 2>/dev/null
            rm "$RESULTS/perf.data"
          REMOTE_SCRIPT

      - name: Fetch results
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          mkdir -p results
          SCP="scp -o StrictHostKeyChecking=no"
          $SCP "${USER}@${HOST}:~/results/actions-report.txt" results/
          $SCP "${USER}@${HOST}:~/results/benchmarks-report.txt" results/
          $SCP "${USER}@${HOST}:~/results/incremental-matcher-timing.txt" results/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: actions-report
          path: results/actions-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-report
          path: results/benchmarks-report.txt

      - uses: actions/upload-artifact@v4
        if: hashFiles('results/incremental-matcher-timing.txt') != ''
        with:
          name: incremental-matcher-timing
          path: results/incremental-matcher-timing.txt

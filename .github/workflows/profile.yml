name: Profiling

on:
  push:
    branches: ['profile/*']

jobs:
  profile:
    name: Profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake git \
            libprotobuf-dev protobuf-compiler libboost-dev libspdlog-dev \
            bison flex linux-tools-common
          # Install the actual perf binary (the -tools package that the symlink targets)
          SYMLINK=$(readlink /usr/lib/linux-tools/$(uname -r) 2>/dev/null)
          TOOLS_PKG=$(basename "$SYMLINK")
          sudo apt-get install -y "$TOOLS_PKG"

      - name: Build abseil from source
        run: |
          git clone --depth 1 --branch 20240116.2 https://github.com/abseil/abseil-cpp.git /tmp/abseil
          cd /tmp/abseil
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DABSL_ENABLE_INSTALL=ON \
            -DABSL_USE_SYSTEM_INCLUDES=ON
          cmake --build build -j$(nproc)
          sudo cmake --install build
          sudo ldconfig

      - name: Install saengra in debug mode
        env:
          AVOID_HOMEBREW: "1"
          SAENGRA_DEBUG: "1"
        run: |
          pip install setuptools wheel "cmake>=3.15"
          pip install --no-cache-dir --no-build-isolation -e ".[dev]"
          python -c "from saengra.c_extension import DirectAdapter; print('c_extension OK')"

      - name: Checkout vic repo
        uses: actions/checkout@v4
        with:
          repository: Saluev/vic
          token: ${{ secrets.VIC_ACCESS_TOKEN }}
          path: vic

      - name: Install vic dependencies
        run: pip install -r vic/requirements.txt

      - name: Run profiling with perf
        run: |
          echo "=== Debugging perf installation ==="
          dpkg -L linux-tools-$(uname -r) 2>/dev/null || true
          find / -name "perf" -type f 2>/dev/null || true
          ls -la /usr/lib/linux-tools/ 2>/dev/null || true
          which perf 2>/dev/null || true
          PERF=$(find / -name "perf" -path "*/linux-tools/*" -type f 2>/dev/null | head -1)
          if [ -z "$PERF" ]; then PERF=perf; fi
          echo "Using perf: $PERF"
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          $PERF record -g --call-graph dwarf -o perf.data -- \
            python -m pytest vic/tests/vic/actions -v -s 2>&1 | tee pytest-output.txt || true
          $PERF report -n --stdio --sort=sym,srcline -g none -i perf.data > profile-report.txt 2>/dev/null || true
          echo "=== Profile Report (top 80) ==="
          head -80 profile-report.txt

      - name: Run profiling with py-spy
        run: |
          pip install py-spy
          py-spy record -o profile.svg --native --format flamegraph -- \
            python -m pytest vic/tests/vic/actions -v -s 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: |
            profile.svg
            profile-report.txt
            perf.data
